# nxnative cloud build — build an unsigned IPA on a GitHub Actions macOS runner.
#
# How the pieces arrive (nothing sensitive is ever a workflow input or in the repo):
#   - Repository secret PROD_KEYS_B64 : your prod.keys, base64-encoded or raw text
#   - Repository secret NSP_ZIP_URL   : a direct-download URL for ONE .zip that
#                                       contains the game's .nsp file(s) at its top level
# The IPA is split into <2 GB parts and uploaded as a workflow artifact.
#
# Runner choice: macos-26 (Apple Silicon, ships Xcode 26 / iOS 26 SDK — the games
# need a minimum of iOS 26, so an older SDK cannot build them).

name: Build IPA (nxnative)

on:
  workflow_dispatch:
    inputs:
      language:
        description: "Game language code (zh-Hans, zh-Hant, ja, en-US, ...)"
        required: false
        default: "zh-Hans"
      package:
        description: "Optional package version to pack, e.g. v0 or v327680 (empty = newest in the folder)"
        required: false
        default: ""
      app_name:
        description: "Optional home-screen name (empty = the game's own name)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Check out nxnative
        uses: actions/checkout@v4

      - name: Show runner and free disk
        run: |
          uname -m
          xcodebuild -version
          df -h / "$RUNNER_TEMP" | cat
          python3 --version
          dotnet --list-sdks || true

      - name: Install build tools
        run: |
          brew install xcodegen zstd spirv-cross glslang
          # The build script requires the .NET 10 SDK specifically.
          if ! dotnet --list-sdks 2>/dev/null | grep -q '^10\.'; then
            brew install --cask dotnet-sdk
          fi
          dotnet --list-sdks
          python3 -m pip install --user --break-system-packages lz4 capstone fonttools
          # zstd: stdlib compression.zstd from Python 3.14; the backport is only for older Pythons.
          python3 - <<'EOF'
          import subprocess, sys
          try:
              import compression.zstd
              print("stdlib compression.zstd OK")
          except ImportError:
              subprocess.check_call([sys.executable, "-m", "pip", "install", "--user", "--break-system-packages", "backports.zstd"])
          EOF

      - name: Fetch game files and keys (from secrets, never printed)
        env:
          PROD_KEYS_B64: ${{ secrets.PROD_KEYS_B64 }}
          NSP_ZIP_URL: ${{ secrets.NSP_ZIP_URL }}
        run: |
          set -eu
          if [ -z "${PROD_KEYS_B64:-}" ] || [ -z "${NSP_ZIP_URL:-}" ]; then
            echo "::error::Set repository secrets PROD_KEYS_B64 and NSP_ZIP_URL first (see the setup doc)."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/game"
          # The secret may hold prod.keys either base64-encoded or as raw text;
          # accept both (raw text contains the key names in plain form).
          printf '%s' "$PROD_KEYS_B64" > "$RUNNER_TEMP/keys_secret.txt"
          if grep -q 'aes_kek_generation_source' "$RUNNER_TEMP/keys_secret.txt"; then
            cp "$RUNNER_TEMP/keys_secret.txt" "$RUNNER_TEMP/prod.keys"
          else
            base64 --decode < "$RUNNER_TEMP/keys_secret.txt" > "$RUNNER_TEMP/prod.keys"
          fi
          rm -f "$RUNNER_TEMP/keys_secret.txt"
          chmod 600 "$RUNNER_TEMP/prod.keys"
          # Sanity-check the keys file shape without printing any key material.
          grep -q 'aes_kek_generation_source' "$RUNNER_TEMP/prod.keys" \
            || { echo "::error::prod.keys does not look like a prod.keys file."; exit 1; }
          # Google Drive share links need gdown (large files have a confirm step
          # plain curl cannot pass); anything else is fetched as a direct download.
          if printf '%s' "$NSP_ZIP_URL" | grep -q 'drive\.google\.com\|drive\.usercontent\.google\.com'; then
            python3 -m pip install --user --break-system-packages gdown
            # gdown 6.x takes the share URL (or file ID) directly; --fuzzy was removed.
            python3 -m gdown "$NSP_ZIP_URL" -O "$RUNNER_TEMP/game.zip"
          else
            curl -fL --retry 3 -o "$RUNNER_TEMP/game.zip" "$NSP_ZIP_URL"
          fi
          unzip -q "$RUNNER_TEMP/game.zip" -d "$RUNNER_TEMP/game"
          rm -f "$RUNNER_TEMP/game.zip"
          # Drop macOS metadata junk (._ AppleDouble files masquerade as .nsp/.nsz).
          rm -rf "$RUNNER_TEMP/game/__MACOSX"
          find "$RUNNER_TEMP/game" -name '._*' -delete
          # Accept one extra nesting level (a folder inside the zip).
          if ! find "$RUNNER_TEMP/game" -maxdepth 2 \( -iname '*.nsp' -o -iname '*.xci' -o -iname '*.nsz' \) | grep -q .; then
            echo "::error::No .nsp/.xci/.nsz found in the downloaded zip."
            find "$RUNNER_TEMP/game" -maxdepth 2 | head -50
            exit 1
          fi
          df -h / | cat

      - name: Decompress any .nsz files to .nsp
        run: |
          set -eu
          # nxnative only reads .nsp/.xci; an .nsz is a compressed NSP and must
          # be decompressed first (nsz tool, using the same prod.keys).
          NSZ_LIST=$(find "$RUNNER_TEMP/game" -maxdepth 3 -iname '*.nsz')
          if [ -z "$NSZ_LIST" ]; then
            echo "No .nsz files, skipping."
            exit 0
          fi
          python3 -m venv "$RUNNER_TEMP/nsz-venv"
          "$RUNNER_TEMP/nsz-venv/bin/pip" install -q nsz
          echo "$NSZ_LIST" | while IFS= read -r f; do
            echo "Decompressing: $f"
            "$RUNNER_TEMP/nsz-venv/bin/nsz" -D -w --keys "$RUNNER_TEMP/prod.keys" -o "$(dirname "$f")" "$f"
            rm -f "$f"
          done
          find "$RUNNER_TEMP/game" -iname '*.nsp' -exec ls -lh {} \;

      - name: Build the IPA
        env:
          PKG: ${{ inputs.package }}
          APPNAME: ${{ inputs.app_name }}
          LANGCODE: ${{ inputs.language }}
        run: |
          set -eu
          set -o pipefail
          # nx_extract is a .NET apphost: it does not search PATH for the runtime,
          # only DOTNET_ROOT / the default /usr/local/share/dotnet. The runner image
          # keeps its SDKs in ~/.dotnet, so point DOTNET_ROOT there.
          export DOTNET_ROOT="$HOME/.dotnet"
          export DOTNET_ROOT_ARM64="$HOME/.dotnet"
          # If the zip nested the NSPs in one folder, build from that folder.
          GAME_DIR="$RUNNER_TEMP/game"
          if ! ls "$GAME_DIR"/*.nsp "$GAME_DIR"/*.xci >/dev/null 2>&1; then
            SUB=$(find "$GAME_DIR" -maxdepth 2 \( -iname '*.nsp' -o -iname '*.xci' \) -exec dirname {} \; | sort -u | head -1)
            [ -n "$SUB" ] && GAME_DIR="$SUB"
          fi
          echo "Game folder: $GAME_DIR"
          ls -lh "$GAME_DIR"
          # The repo's shader chain lock was registered with the author's tools;
          # re-register it with this runner's tools before building (upstream's
          # documented local flow in dm/gfx/README.md). The lock is tool-only
          # fingerprints; DM_GAME just satisfies the tool's profile loading.
          GAME_ID=$(ls "$GAME_DIR" | grep -oiE '01[0-9a-f]{14}' | head -1)
          echo "Registering shader chain lock for game: $GAME_ID"
          DM_GAME="$GAME_ID" python3 dm/gfx/tools/dmsh_chain.py --update-lock
          # The new lock changes the chain version; re-stamp the profile header to match.
          DM_GAME="$GAME_ID" python3 dm/gfx/tools/dmsh_chain.py --header
          mkdir -p "$GITHUB_WORKSPACE/out"
          ARGS=("$GAME_DIR" -k "$RUNNER_TEMP/prod.keys" -o "$GITHUB_WORKSPACE/out/game.ipa"
                -l "$LANGCODE" --no-keep-extracted --progress lines)
          [ -n "$PKG" ] && ARGS+=(-p "$PKG")
          [ -n "$APPNAME" ] && ARGS+=(--app-name "$APPNAME")
          python3 scripts/build_ipa_from_nsp.py "${ARGS[@]}" 2>&1 | tee build.log
          # Guard: an internal tool failure must not pass silently (empty out/).
          test -s "$GITHUB_WORKSPACE/out/game.ipa" || { echo "::error::Build finished without producing out/game.ipa — see build.log"; exit 1; }
          ls -lh "$GITHUB_WORKSPACE/out"

      - name: Split and checksum the IPA
        if: success()
        run: |
          cd "$GITHUB_WORKSPACE/out"
          shasum -a 256 game.ipa > game.ipa.sha256
          # Release assets and some download paths cap at 2 GB per file; split at 1.9 GB.
          split -b 1900m game.ipa game.ipa.part-
          rm -f game.ipa
          ls -lh

      - name: Upload IPA parts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-ipa
          path: |
            out/game.ipa.part-*
            out/game.ipa.sha256
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
