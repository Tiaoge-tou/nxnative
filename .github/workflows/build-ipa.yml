# nxnative cloud build — build an unsigned IPA on a GitHub Actions macOS runner.
#
# How the pieces arrive (nothing sensitive is ever a workflow input or in the repo):
#   - Repository secret PROD_KEYS_B64 : your prod.keys, base64-encoded or raw text
#   - Repository secret NSP_ZIP_URL   : a direct-download URL for ONE .zip that
#                                       contains the game's .nsp file(s) at its top level
#   - Repository secret QUARK_COOKIE  : only for source=quark — your Quark drive
#                                       cookie; the runner then pulls the game's
#                                       .nsp/.nsz files straight from Quark
#                                       through a throwaway local AList server,
#                                       so no zip has to be uploaded anywhere.
#   - Repository secret HF_TOKEN      : only for source=hf — a Hugging Face
#                                       read token for the private dataset
#                                       repo Tiaoge-tou/game-archives, which
#                                       holds the same game zips (hades2.zip,
#                                       silksong.zip) without Drive's quotas.
# Only the app-only (slim) IPA is uploaded as a workflow artifact: the game's
# RomFS is installed once into the app's Documents, and later builds ship
# without it.
#
# Runner choice: macos-26 (Apple Silicon, ships Xcode 26 / iOS 26 SDK — the games
# need a minimum of iOS 26, so an older SDK cannot build them).

name: Build IPA (nxnative)

on:
  workflow_dispatch:
    inputs:
      language:
        description: "Game language code (zh-Hans, zh-Hant, ja, en-US, ...)"
        required: false
        default: "zh-Hans"
      package:
        description: "Optional package version to pack, e.g. v0 or v327680 (empty = newest in the folder)"
        required: false
        default: ""
      app_name:
        description: "Optional home-screen name (empty = the game's own name)"
        required: false
        default: ""
      skin:
        description: "Silksong skin (DM_PAD_SKIN env switch; the aspect ratio is a launcher setting)"
        type: boolean
        required: false
        default: true
      hades:
        description: "Hades layout: Liquid Glass gamepad (DM_PAD_HADES env switch; the aspect ratio is a launcher setting)"
        type: boolean
        required: false
        default: false
      romfs_img:
        description: "Also upload the extracted RomFS.img as an artifact (the one-time datapack import for a separate-RomFS build; several GB)"
        type: boolean
        required: false
        default: false
      source:
        description: "Where the game files come from: drive = the zip at NSP_ZIP_URL; quark = pull the .nsp/.nsz files straight from your Quark drive (needs the QUARK_COOKIE secret); hf = the zip named by hf_file from the Hugging Face dataset repo (needs the HF_TOKEN secret); parts = a zip split into <2 GB parts held as assets of a DRAFT release in this repo (parts_tag names the release, parts_sha256 optionally verifies the joined zip; no secret needed)"
        type: choice
        options:
          - drive
          - quark
          - hf
          - parts
        required: false
        default: drive
      quark_dir:
        description: "Quark only: folder holding the game files (empty = look at the drive root, then one folder down)"
        required: false
        default: ""
      hf_file:
        description: "HF only: zip file name in the dataset repo Tiaoge-tou/game-archives (hades2.zip or silksong.zip)"
        required: false
        default: "hades2.zip"
      parts_tag:
        description: "Parts only: tag of the DRAFT release in this repo holding the zip parts as assets"
        required: false
        default: "dsr-parts"
      parts_sha256:
        description: "Parts only: expected SHA-256 of the joined zip (empty = verify part sizes only)"
        required: false
        default: ""
      fetch_only:
        description: "Only fetch and verify the game files, then stop (no build)"
        type: boolean
        required: false
        default: false
      full:
        description: "Also upload the full IPA (with RomFS) split into ~450 MB parts — needed for a game's first install; later builds only need the slim one"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 350
    steps:
      - name: Check out nxnative
        uses: actions/checkout@v4

      - name: Show runner and free disk
        run: |
          uname -m
          xcodebuild -version
          df -h / "$RUNNER_TEMP" | cat
          python3 --version
          dotnet --list-sdks || true

      - name: Install build tools
        run: |
          brew install xcodegen zstd spirv-cross glslang
          # The build script requires the .NET 10 SDK specifically.
          if ! dotnet --list-sdks 2>/dev/null | grep -q '^10\.'; then
            brew install --cask dotnet-sdk
          fi
          dotnet --list-sdks
          python3 -m pip install --user --break-system-packages lz4 capstone fonttools
          # zstd: stdlib compression.zstd from Python 3.14; the backport is only for older Pythons.
          python3 - <<'EOF'
          import subprocess, sys
          try:
              import compression.zstd
              print("stdlib compression.zstd OK")
          except ImportError:
              subprocess.check_call([sys.executable, "-m", "pip", "install", "--user", "--break-system-packages", "backports.zstd"])
          EOF

      - name: Fetch game files and keys (from secrets, never printed)
        env:
          PROD_KEYS_B64: ${{ secrets.PROD_KEYS_B64 }}
          NSP_ZIP_URL: ${{ secrets.NSP_ZIP_URL }}
          QUARK_COOKIE: ${{ secrets.QUARK_COOKIE }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SOURCE: ${{ inputs.source }}
          QUARK_DIR: ${{ inputs.quark_dir }}
          HF_FILE: ${{ inputs.hf_file }}
          GH_TOKEN: ${{ github.token }}
          PARTS_TAG: ${{ inputs.parts_tag }}
          PARTS_SHA256: ${{ inputs.parts_sha256 }}
        run: |
          set -eu
          if [ -z "${PROD_KEYS_B64:-}" ]; then
            echo "::error::Set the repository secret PROD_KEYS_B64 first (see the setup doc)."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/game"
          # The secret may hold prod.keys either base64-encoded or as raw text;
          # accept both (raw text contains the key names in plain form).
          printf '%s' "$PROD_KEYS_B64" > "$RUNNER_TEMP/keys_secret.txt"
          if grep -q 'aes_kek_generation_source' "$RUNNER_TEMP/keys_secret.txt"; then
            cp "$RUNNER_TEMP/keys_secret.txt" "$RUNNER_TEMP/prod.keys"
          else
            base64 --decode < "$RUNNER_TEMP/keys_secret.txt" > "$RUNNER_TEMP/prod.keys"
          fi
          rm -f "$RUNNER_TEMP/keys_secret.txt"
          chmod 600 "$RUNNER_TEMP/prod.keys"
          # Sanity-check the keys file shape without printing any key material.
          grep -q 'aes_kek_generation_source' "$RUNNER_TEMP/prod.keys" \
            || { echo "::error::prod.keys does not look like a prod.keys file."; exit 1; }
          if [ "$SOURCE" = "quark" ]; then
            # ---- Quark route: serve the drive through a local AList and pull
            # the game files directly; the cookie never leaves the env.
            if [ -z "${QUARK_COOKIE:-}" ]; then
              echo "::error::Set the repository secret QUARK_COOKIE first."
              exit 1
            fi
            ALIST_DIR="$RUNNER_TEMP/alist"
            mkdir -p "$ALIST_DIR" && cd "$ALIST_DIR"
            ALIST_VER=$(curl -s https://api.github.com/repos/AlistGo/alist/releases/latest | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -1)
            echo "AList version: $ALIST_VER"
            curl -fL --retry 3 -o alist.tar.gz "https://github.com/AlistGo/alist/releases/download/$ALIST_VER/alist-darwin-arm64.tar.gz"
            tar -xzf alist.tar.gz
            ALIST_PW=$(openssl rand -hex 16)
            ./alist admin set "$ALIST_PW" >/dev/null
            ./alist server >alist.log 2>&1 &
            for i in $(seq 1 30); do
              curl -s -o /dev/null http://127.0.0.1:5244/api/public/settings && break || sleep 1
            done
            TOKEN=$(curl -s -X POST http://127.0.0.1:5244/api/auth/login -H 'Content-Type: application/json' -d "{\"username\":\"admin\",\"password\":\"$ALIST_PW\"}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["token"])' || true)
            if [ -z "$TOKEN" ]; then
              echo "::error::AList admin login failed."
              tail -20 alist.log || true
              exit 1
            fi
            export ALIST_TOKEN="$TOKEN"
            export MANIFEST="$RUNNER_TEMP/manifest.tsv"
            # Create the Quark storage and locate the game files: the named
            # folder, else the drive root, else the single first-level folder
            # that holds game files (several such folders = ambiguous, stop).
            python3 - <<'EOF'
          import json, os, urllib.request
          TOK = os.environ["ALIST_TOKEN"]
          def api(path, body):
              req = urllib.request.Request("http://127.0.0.1:5244" + path,
                  data=json.dumps(body).encode(), method="POST",
                  headers={"Content-Type": "application/json", "Authorization": TOK})
              return json.load(urllib.request.urlopen(req))
          body = {"mount_path": "/quark", "driver": "Quark",
                  "addition": json.dumps({"cookie": os.environ["QUARK_COOKIE"],
                                          "root_folder_id": "0",
                                          "use_transcoding_address": False})}
          resp = api("/api/admin/storage/create", body)
          assert resp.get("code") == 200, "storage create failed: %s" % resp.get("message")
          def listdir(path):
              resp = api("/api/fs/list", {"path": path, "refresh": True, "page": 1, "per_page": 200})
              if resp.get("code") != 200:
                  raise SystemExit("listing %s failed: %s" % (path, resp.get("message")))
              return resp["data"]["content"] or []
          WANT = (".nsp", ".xci", ".nsz")
          def games_in(path):
              return [(i["name"], i["size"], path.rstrip("/") + "/" + i["name"])
                      for i in listdir(path)
                      if not i["is_dir"] and i["name"].lower().endswith(WANT)]
          root = "/quark"
          if os.environ.get("QUARK_DIR"):
              root = "/quark/" + os.environ["QUARK_DIR"].strip("/")
          found = games_in(root)
          if not found and root == "/quark":
              holders = []
              for item in listdir(root):
                  if item["is_dir"]:
                      g = games_in(root + "/" + item["name"])
                      if g:
                          holders.append(g)
              if len(holders) > 1:
                  raise SystemExit("Several folders hold game files; set the quark_dir input.")
              if holders:
                  found = holders[0]
          if not found:
              raise SystemExit("No .nsp/.xci/.nsz found in Quark at " + root)
          with open(os.environ["MANIFEST"], "w") as f:
              for name, size, path in found:
                  f.write("%s\t%d\t%s\n" % (name, size, path))
          total = 0
          for name, size, path in found:
              print("Found: %s (%d bytes)" % (name, size))
              total += size
          print("Total: %d bytes" % total)
          EOF
            # Probe the throughput on the first file before committing to the
            # full pull: Quark throttles datacenter IPs hard for some accounts,
            # and a crawl is not worth a multi-hour run. The cap looks
            # per-connection (a single curl stream measured ~55 KB/s in run
            # #26), so probe and pull with aria2 over 16 parallel connections
            # and judge the AGGREGATE speed against the same 256 KB/s floor.
            command -v aria2c >/dev/null 2>&1 || brew install aria2
            FIRST_PATH=$(head -1 "$MANIFEST" | cut -f3)
            FIRST_URL="http://127.0.0.1:5244/d$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$FIRST_PATH")"
            mkdir -p "$RUNNER_TEMP/probe"
            aria2c -x16 -s16 --file-allocation=none --summary-interval=10 \
              --console-log-level=notice -d "$RUNNER_TEMP/probe" -o probe.bin \
              "$FIRST_URL" > "$RUNNER_TEMP/probe.log" 2>&1 &
            PROBE_PID=$!
            sleep 70
            kill "$PROBE_PID" 2>/dev/null || true
            wait "$PROBE_PID" 2>/dev/null || true
            SPEED=$(python3 -c '
            import re
            try:
                txt = open(__import__("os").environ["RUNNER_TEMP"] + "/probe.log").read()
            except Exception:
                txt = ""
            hits = re.findall(r"DL:([0-9.]+)(KiB|MiB|GiB|B)", txt)
            if not hits:
                print(0)
            else:
                val, unit = hits[-1]
                mult = {"B": 1, "KiB": 1024, "MiB": 1048576, "GiB": 1073741824}[unit]
                print(int(float(val) * mult))
            ')
            echo "Quark probe speed (16 connections): ${SPEED:-0} B/s"
            rm -rf "$RUNNER_TEMP/probe" "$RUNNER_TEMP/probe.log"
            if ! python3 -c "import sys; sys.exit(0 if float('${SPEED:-0}') >= 262144 else 1)"; then
              echo "::error::Quark download from this runner is too slow (<256 KB/s aggregate over 16 connections) or failed; aborting. Use the Drive route instead."
              exit 1
            fi
            while IFS="$(printf '\t')" read -r NAME SIZE P; do
              URL="http://127.0.0.1:5244/d$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$P")"
              echo "Downloading $NAME ($SIZE bytes)"
              if ! aria2c -x16 -s16 -c --file-allocation=none --retry-wait=5 -m 5 \
                   --console-log-level=warn -d "$RUNNER_TEMP/game" -o "$NAME" "$URL"; then
                echo "::error::Download failed: $NAME"; exit 1
              fi
              ACTUAL=$(stat -f%z "$RUNNER_TEMP/game/$NAME")
              [ "$ACTUAL" = "$SIZE" ] || { echo "::error::Size mismatch for $NAME: got $ACTUAL, want $SIZE"; exit 1; }
            done < "$MANIFEST"
            pkill -f 'alist server' || true
          elif [ "$SOURCE" = "hf" ]; then
            # ---- Hugging Face route: one zip from the private dataset repo
            # Tiaoge-tou/game-archives; the token never leaves the env.
            if [ -z "${HF_TOKEN:-}" ]; then
              echo "::error::Set the repository secret HF_TOKEN first."
              exit 1
            fi
            HF_NAME="${HF_FILE:-hades2.zip}"
            HF_URL="https://huggingface.co/datasets/Tiaoge-tou/game-archives/resolve/main/$HF_NAME"
            echo "Downloading $HF_URL"
            curl -fL --retry 3 -H "Authorization: Bearer $HF_TOKEN" -o "$RUNNER_TEMP/game.zip" "$HF_URL"
            # Byte-size check for the two known archives (same rule as the
            # Quark route: a short or wrong download must not reach the build).
            case "$HF_NAME" in
              hades2.zip)   HF_WANT=6728183316 ;;
              silksong.zip) HF_WANT=2852569814 ;;
              *)            HF_WANT="" ;;
            esac
            if [ -n "$HF_WANT" ]; then
              HF_ACTUAL=$(stat -f%z "$RUNNER_TEMP/game.zip")
              [ "$HF_ACTUAL" = "$HF_WANT" ] || { echo "::error::Size mismatch for $HF_NAME: got $HF_ACTUAL, want $HF_WANT"; exit 1; }
              echo "Size verified: $HF_NAME ($HF_ACTUAL bytes)"
            fi
            unzip -q "$RUNNER_TEMP/game.zip" -d "$RUNNER_TEMP/game"
            rm -f "$RUNNER_TEMP/game.zip"
          elif [ "$SOURCE" = "parts" ]; then
            # ---- Release-parts route: one zip split into <2 GB parts held as
            # assets of a DRAFT release in this same repo. A draft is not
            # public, and this repo's own workflow token can read it, so the
            # route needs no secret. For a game archive that cannot be pushed
            # to Drive/HF in one shot from the maintainer's side; the parts
            # are joined in name order and verified before the unzip.
            TAG="${PARTS_TAG:-dsr-parts}"
            echo "Fetching parts from draft release $TAG in $GITHUB_REPOSITORY"
            mkdir -p "$RUNNER_TEMP/parts"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets | sort_by(.name)[] | "\(.id)\t\(.name)\t\(.size)"' > "$RUNNER_TEMP/parts/list.tsv"
            if [ ! -s "$RUNNER_TEMP/parts/list.tsv" ]; then
              echo "::error::No assets found on release $TAG."
              exit 1
            fi
            : > "$RUNNER_TEMP/game.zip"
            WANT_TOTAL=0
            while IFS=$'\t' read -r AID ANAME ASIZE; do
              echo "Part $ANAME ($ASIZE bytes)"
              gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$AID" > "$RUNNER_TEMP/parts/part.bin"
              ACTUAL=$(stat -f%z "$RUNNER_TEMP/parts/part.bin")
              [ "$ACTUAL" = "$ASIZE" ] || { echo "::error::Size mismatch for part $ANAME: got $ACTUAL, want $ASIZE"; exit 1; }
              cat "$RUNNER_TEMP/parts/part.bin" >> "$RUNNER_TEMP/game.zip"
              rm -f "$RUNNER_TEMP/parts/part.bin"
              WANT_TOTAL=$((WANT_TOTAL + ASIZE))
            done < "$RUNNER_TEMP/parts/list.tsv"
            TOTAL=$(stat -f%z "$RUNNER_TEMP/game.zip")
            [ "$TOTAL" = "$WANT_TOTAL" ] || { echo "::error::Joined size mismatch: got $TOTAL, want $WANT_TOTAL"; exit 1; }
            echo "Joined $TOTAL bytes from $(wc -l < "$RUNNER_TEMP/parts/list.tsv" | tr -d ' ') parts"
            if [ -n "${PARTS_SHA256:-}" ]; then
              echo "$PARTS_SHA256  $RUNNER_TEMP/game.zip" | shasum -a 256 -c - || { echo "::error::SHA-256 mismatch for the joined zip"; exit 1; }
              echo "SHA-256 verified"
            fi
            unzip -q "$RUNNER_TEMP/game.zip" -d "$RUNNER_TEMP/game"
            rm -f "$RUNNER_TEMP/game.zip"
          else
            # ---- Drive route: one zip from NSP_ZIP_URL.
            if [ -z "${NSP_ZIP_URL:-}" ]; then
              echo "::error::Set the repository secret NSP_ZIP_URL first (see the setup doc)."
              exit 1
            fi
            # Google Drive share links need gdown (large files have a confirm step
            # plain curl cannot pass); anything else is fetched as a direct download.
            if printf '%s' "$NSP_ZIP_URL" | grep -q 'drive\.google\.com\|drive\.usercontent\.google\.com'; then
              python3 -m pip install --user --break-system-packages gdown
              # gdown 6.x takes the share URL (or file ID) directly; --fuzzy was removed.
              python3 -m gdown "$NSP_ZIP_URL" -O "$RUNNER_TEMP/game.zip"
            else
              curl -fL --retry 3 -o "$RUNNER_TEMP/game.zip" "$NSP_ZIP_URL"
            fi
            unzip -q "$RUNNER_TEMP/game.zip" -d "$RUNNER_TEMP/game"
            rm -f "$RUNNER_TEMP/game.zip"
          fi
          # Drop macOS metadata junk (._ AppleDouble files masquerade as .nsp/.nsz).
          rm -rf "$RUNNER_TEMP/game/__MACOSX"
          find "$RUNNER_TEMP/game" -name '._*' -delete
          # Accept one extra nesting level (a folder inside the zip).
          if ! find "$RUNNER_TEMP/game" -maxdepth 2 \( -iname '*.nsp' -o -iname '*.xci' -o -iname '*.nsz' \) | grep -q .; then
            echo "::error::No .nsp/.xci/.nsz found in the fetched game files."
            find "$RUNNER_TEMP/game" -maxdepth 2 | head -50
            exit 1
          fi
          df -h / | cat

      - name: Decompress any .nsz files to .nsp
        if: ${{ !inputs.fetch_only }}
        run: |
          set -eu
          # nxnative only reads .nsp/.xci; an .nsz is a compressed NSP and must
          # be decompressed first (nsz tool, using the same prod.keys).
          NSZ_LIST=$(find "$RUNNER_TEMP/game" -maxdepth 3 -iname '*.nsz')
          if [ -z "$NSZ_LIST" ]; then
            echo "No .nsz files, skipping."
            exit 0
          fi
          python3 -m venv "$RUNNER_TEMP/nsz-venv"
          "$RUNNER_TEMP/nsz-venv/bin/pip" install -q nsz
          echo "$NSZ_LIST" | while IFS= read -r f; do
            echo "Decompressing: $f"
            "$RUNNER_TEMP/nsz-venv/bin/nsz" -D -w --keys "$RUNNER_TEMP/prod.keys" -o "$(dirname "$f")" "$f"
            rm -f "$f"
          done
          find "$RUNNER_TEMP/game" -iname '*.nsp' -exec ls -lh {} \;

      - name: Build the IPA
        if: ${{ !inputs.fetch_only }}
        env:
          PKG: ${{ inputs.package }}
          APPNAME: ${{ inputs.app_name }}
          LANGCODE: ${{ inputs.language }}
        run: |
          set -eu
          set -o pipefail
          # nx_extract is a .NET apphost: it does not search PATH for the runtime,
          # only DOTNET_ROOT / the default /usr/local/share/dotnet. The runner image
          # keeps its SDKs in ~/.dotnet, so point DOTNET_ROOT there.
          export DOTNET_ROOT="$HOME/.dotnet"
          export DOTNET_ROOT_ARM64="$HOME/.dotnet"
          # If the zip nested the NSPs in one folder, build from that folder.
          GAME_DIR="$RUNNER_TEMP/game"
          if ! ls "$GAME_DIR"/*.nsp "$GAME_DIR"/*.xci >/dev/null 2>&1; then
            SUB=$(find "$GAME_DIR" -maxdepth 2 \( -iname '*.nsp' -o -iname '*.xci' \) -exec dirname {} \; | sort -u | head -1)
            [ -n "$SUB" ] && GAME_DIR="$SUB"
          fi
          echo "Game folder: $GAME_DIR"
          ls -lh "$GAME_DIR"
          # The repo's shader chain lock was registered with the author's tools;
          # re-register it with this runner's tools before building (upstream's
          # documented local flow in dm/gfx/README.md). The lock is tool-only
          # fingerprints; DM_GAME just satisfies the tool's profile loading.
          GAME_ID=$(ls "$GAME_DIR" | grep -oiE '01[0-9a-f]{14}' | head -1)
          echo "Registering shader chain lock for game: $GAME_ID"
          DM_GAME="$GAME_ID" python3 dm/gfx/tools/dmsh_chain.py --update-lock
          # The new lock changes the chain version; re-stamp the profile header to match.
          DM_GAME="$GAME_ID" python3 dm/gfx/tools/dmsh_chain.py --header
          mkdir -p "$GITHUB_WORKSPACE/out"
          ARGS=("$GAME_DIR" -k "$RUNNER_TEMP/prod.keys" -o "$GITHUB_WORKSPACE/out/game.ipa"
                -l "$LANGCODE" --romfs separate --progress lines)
          [ -n "$PKG" ] && ARGS+=(-p "$PKG")
          [ -n "$APPNAME" ] && ARGS+=(--app-name "$APPNAME")
          # Skin build: bake the env switches into the bundle's dm/env.txt (main.m
          # applies them at boot; Documents/env.txt can still override on device).
          if [ "${{ inputs.skin }}" = "true" ]; then
            printf 'DM_PAD_SKIN=1\n' > "$RUNNER_TEMP/dm-env.txt"
            ARGS+=(--env-file "$RUNNER_TEMP/dm-env.txt")
            echo "Skin build: DM_PAD_SKIN=1"
          fi
          if [ "${{ inputs.hades }}" = "true" ]; then
            printf 'DM_PAD_HADES=1\n' > "$RUNNER_TEMP/dm-env.txt"
            ARGS+=(--env-file "$RUNNER_TEMP/dm-env.txt")
            echo "Hades build: DM_PAD_HADES=1"
          fi
          python3 scripts/build_ipa_from_nsp.py "${ARGS[@]}" 2>&1 | tee build.log
          # Guard: an internal tool failure must not pass silently (empty out/).
          test -s "$GITHUB_WORKSPACE/out/game.ipa" || { echo "::error::Build finished without producing out/game.ipa — see build.log"; exit 1; }
          ls -lh "$GITHUB_WORKSPACE/out"

      - name: Pack the app-only IPA (no bundled RomFS, for Documents/romfs)
        if: ${{ success() && !inputs.fetch_only }}
        run: |
          # The same app without its bundled RomFS: a small single-file download.
          # The app prefers Documents/romfs over the bundled one, so anyone who
          # already placed the RomFS pack there can install this over the top.
          cd "$RUNNER_TEMP" && rm -rf slim-pack && mkdir slim-pack && cd slim-pack
          unzip -q "$GITHUB_WORKSPACE/out/game.ipa"
          rm -rf Payload/DmIOS.app/romfs
          rm -f Payload/DmIOS.app/romfs.img
          mkdir -p "$GITHUB_WORKSPACE/out-slim"
          zip -q -r "$GITHUB_WORKSPACE/out-slim/game-slim.ipa" Payload
          cd "$GITHUB_WORKSPACE/out-slim"
          shasum -a 256 game-slim.ipa > game-slim.ipa.sha256
          ls -lh

      - name: Upload app-only IPA
        if: ${{ success() && !inputs.fetch_only }}
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-ipa-slim
          path: |
            out-slim/game-slim.ipa
            out-slim/game-slim.ipa.sha256
          retention-days: 7

      - name: Upload the extracted RomFS image (one-time datapack import)
        if: ${{ success() && inputs.romfs_img }}
        run: |
          IMG=$(find "$RUNNER_TEMP/game" -name RomFS.img -type f | head -1)
          [ -n "$IMG" ] || { echo "::error::romfs_img was requested but no RomFS.img was extracted"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/out-img"
          cp "$IMG" "$GITHUB_WORKSPACE/out-img/RomFS.img"
          ls -lh "$GITHUB_WORKSPACE/out-img"

      - name: Upload RomFS image artifact
        if: ${{ success() && inputs.romfs_img }}
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-romfs-img
          path: out-img/RomFS.img
          retention-days: 7

      - name: Split the full IPA for download
        if: ${{ success() && inputs.full }}
        run: |
          # The full IPA (app + RomFS) is several GB: split it into parts the
          # phone can reassemble byte-exactly (cat game.ipa.part-* > game.ipa).
          mkdir -p "$GITHUB_WORKSPACE/out-full"
          cp "$GITHUB_WORKSPACE/out/game.ipa" "$GITHUB_WORKSPACE/out-full/game.ipa"
          cd "$GITHUB_WORKSPACE/out-full"
          shasum -a 256 game.ipa > game.ipa.sha256
          split -b 450m game.ipa game.ipa.part-
          rm -f game.ipa
          ls -lh

      - name: Upload full IPA parts
        if: ${{ success() && inputs.full }}
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-ipa-full
          path: out-full/*
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
