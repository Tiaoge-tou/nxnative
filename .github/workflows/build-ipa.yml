name: Build IPA (nxnative)

# PROTOTYPE ONLY (branch proto/shell2): this file REPLACES build-ipa.yml on this branch so the shell
# build can be dispatched (a workflow must exist on the default branch to dispatch at all; the run
# itself uses this branch's file). On this branch it builds one IPA holding Silksong + Hades II
# behind a pick-a-game screen. main keeps the ordinary per-game workflow.
# Two ordinary per-game builds (build_ipa_from_nsp.py, separate RomFS) produce the parts; a third step
# assembles the shell with dm/ios/tools/build_shell_ipa.sh. The per-game IPAs are kept as artifacts too:
# they prove each game still builds and boots its own package from this tree.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 350
    steps:
      - name: Check out nxnative
        uses: actions/checkout@v4

      - name: Show runner and free disk
        run: |
          uname -m
          xcodebuild -version
          df -h / "$RUNNER_TEMP" | cat
          python3 --version
          dotnet --list-sdks || true

      - name: Install build tools
        run: |
          brew install xcodegen zstd spirv-cross glslang
          if ! dotnet --list-sdks 2>/dev/null | grep -q '^10\.'; then
            brew install --cask dotnet-sdk
          fi
          dotnet --list-sdks
          python3 -m pip install --user --break-system-packages lz4 capstone fonttools
          python3 - <<'EOF'
          import subprocess, sys
          try:
              import compression.zstd
              print("stdlib compression.zstd OK")
          except ImportError:
              subprocess.check_call([sys.executable, "-m", "pip", "--user", "--break-system-packages", "backports.zstd"])
          EOF

      - name: Fetch keys (from secrets, never printed)
        env:
          PROD_KEYS_B64: ${{ secrets.PROD_KEYS_B64 }}
        run: |
          set -eu
          printf '%s' "$PROD_KEYS_B64" > "$RUNNER_TEMP/keys_secret.txt"
          if grep -q 'aes_kek_generation_source' "$RUNNER_TEMP/keys_secret.txt"; then
            cp "$RUNNER_TEMP/keys_secret.txt" "$RUNNER_TEMP/prod.keys"
          else
            base64 --decode < "$RUNNER_TEMP/keys_secret.txt" > "$RUNNER_TEMP/prod.keys"
          fi
          rm -f "$RUNNER_TEMP/keys_secret.txt"
          chmod 600 "$RUNNER_TEMP/prod.keys"
          grep -q 'aes_kek_generation_source' "$RUNNER_TEMP/prod.keys" \
            || { echo "::error::prod.keys does not look like a prod.keys file."; exit 1; }

      - name: Fetch both game archives from Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -eu
          if [ -z "${HF_TOKEN:-}" ]; then echo "::error::Set the repository secret HF_TOKEN first."; exit 1; fi
          fetch() {  # $1 = archive name, $2 = expected bytes, $3 = destination folder
            echo "Downloading $1"
            curl -fL --retry 3 -H "Authorization: Bearer $HF_TOKEN" -o "$RUNNER_TEMP/$1" "https://huggingface.co/datasets/Tiaoge-tou/game-archives/resolve/main/$1"
            ACTUAL=$(stat -f%z "$RUNNER_TEMP/$1")
            [ "$ACTUAL" = "$2" ] || { echo "::error::Size mismatch for $1: got $ACTUAL, want $2"; exit 1; }
            echo "Size verified: $1 ($ACTUAL bytes)"
            mkdir -p "$3"
            unzip -q "$RUNNER_TEMP/$1" -d "$3"
            rm -rf "$3/__MACOSX"   # AppleDouble sidecars (._*.nsz) are not game files; the nsz decompressor chokes on them
            rm -f "$RUNNER_TEMP/$1"
          }
          fetch silksong.zip 2852569814 "$RUNNER_TEMP/src-silk"
          fetch hades2.zip 6728183316 "$RUNNER_TEMP/src-hades"
          df -h / "$RUNNER_TEMP" | cat

      - name: Decompress any .nsz files to .nsp
        run: |
          set -eu
          NSZ_LIST=$(find "$RUNNER_TEMP/src-silk" "$RUNNER_TEMP/src-hades" -maxdepth 3 -iname '*.nsz' -not -path '*/__MACOSX/*' -not -name '._*')
          if [ -z "$NSZ_LIST" ]; then echo "No .nsz files, skipping."; exit 0; fi
          python3 -m venv "$RUNNER_TEMP/nsz-venv"
          "$RUNNER_TEMP/nsz-venv/bin/pip" install -q nsz
          echo "$NSZ_LIST" | while IFS= read -r f; do
            echo "Decompressing: $f"
            "$RUNNER_TEMP/nsz-venv/bin/nsz" -D -w --keys "$RUNNER_TEMP/prod.keys" -o "$(dirname "$f")" "$f"
            rm -f "$f"
          done

      - name: Build both games (per-game parts for the shell)
        env:
          LANGCODE: zh-Hans
        run: |
          set -eu
          set -o pipefail
          export DOTNET_ROOT="$HOME/.dotnet"
          export DOTNET_ROOT_ARM64="$HOME/.dotnet"
          mkdir -p "$GITHUB_WORKSPACE/out/logs"
          # The shader chain lock is re-registered with this runner's tools once (as in build-ipa.yml)
          DM_GAME="010013C00E930000" python3 dm/gfx/tools/tool_lock.py --update-lock
          DM_GAME="010013C00E930000" python3 dm/gfx/tools/dmsh_chain.py --header
          build_game() {  # $1 = source folder, $2 = title ID, $3 = env line baked into the game's dm/env.txt
            SRC="$1"; TID="$2"
            GAME_DIR="$SRC"
            if ! ls "$GAME_DIR"/*.nsp "$GAME_DIR"/*.xci >/dev/null 2>&1; then
              SUB=$(find "$GAME_DIR" -maxdepth 2 \( -iname '*.nsp' -o -iname '*.xci' \) -exec dirname {} \; | sort -u | head -1)
              [ -n "$SUB" ] && GAME_DIR="$SUB"
            fi
            echo "Game folder ($TID): $GAME_DIR"; ls -lh "$GAME_DIR"
            printf '%s\n' "$3" > "$RUNNER_TEMP/env-$TID.txt"
            python3 scripts/build_ipa_from_nsp.py "$GAME_DIR" -k "$RUNNER_TEMP/prod.keys" \
              -o "$RUNNER_TEMP/game-$TID.ipa" -l "$LANGCODE" --romfs separate --progress lines \
              --work-dir "$RUNNER_TEMP/build-$TID" --env-file "$RUNNER_TEMP/env-$TID.txt" \
              2>&1 | tee "$GITHUB_WORKSPACE/out/logs/build-$TID.log"
            test -s "$RUNNER_TEMP/game-$TID.ipa" || { echo "::error::No IPA for $TID"; exit 1; }
          }
          build_game "$RUNNER_TEMP/src-silk" 010013C00E930000 "DM_PAD_SKIN=1"
          build_game "$RUNNER_TEMP/src-hades" 0100A00019DE0000 "DM_PAD_HADES=1"
          df -h / "$RUNNER_TEMP" | cat

      - name: Assemble the shell IPA
        env:
          LANGCODE: zh-Hans
        run: |
          set -eu
          set -o pipefail
          export DOTNET_ROOT="$HOME/.dotnet"
          for TID in 010013C00E930000 0100A00019DE0000; do
            GB="$RUNNER_TEMP/build-$TID"
            P=$(dirname "$(find "$GB" -name 'main.patched.bin' | head -1)")
            R=$(find "$GB" -name 'RomFS.img' | head -1)
            BD=$(find "$GB" -type d -name 'b-*' -path '*shader/ios*' | head -1)
            echo "$TID parts: patched=$P romfs=$R msl=$(dirname "$BD")"
            [ -n "$P" ] && [ -n "$R" ] && [ -n "$BD" ] || { echo "::error::parts missing for $TID"; exit 1; }
            case "$TID" in
              010013C00E930000) SILK_PATCHED="$P"; SILK_ROMFS="$R"; SILK_MSL=$(dirname "$BD"); SILK_ENV="$RUNNER_TEMP/env-$TID.txt" ;;
              0100A00019DE0000) HADES_PATCHED="$P"; HADES_ROMFS="$R"; HADES_MSL=$(dirname "$BD"); HADES_ENV="$RUNNER_TEMP/env-$TID.txt" ;;
            esac
          done
          export SILK_PATCHED SILK_ROMFS SILK_MSL SILK_ENV HADES_PATCHED HADES_ROMFS HADES_MSL HADES_ENV
          W="$RUNNER_TEMP/shell-work" DM_LANG="$LANGCODE" \
            bash dm/ios/tools/build_shell_ipa.sh "$GITHUB_WORKSPACE/out/shell.ipa" \
            2>&1 | tee "$GITHUB_WORKSPACE/out/logs/build-shell.log"
          test -s "$GITHUB_WORKSPACE/out/shell.ipa" || { echo "::error::No shell IPA"; exit 1; }
          ls -lh "$GITHUB_WORKSPACE/out"

      - name: Verify the shell IPA
        run: |
          set -eu
          IPA="$GITHUB_WORKSPACE/out/shell.ipa"
          unzip -l "$IPA" > "$RUNNER_TEMP/listing.txt"
          for TID in 010013C00E930000 0100A00019DE0000; do
            grep -q "Payload/DmIOS.app/dm/$TID/launcher.json" "$RUNNER_TEMP/listing.txt" || { echo "::error::dm/$TID/launcher.json missing"; exit 1; }
            grep -q "Payload/DmIOS.app/dm/$TID/shader_map.tsv" "$RUNNER_TEMP/listing.txt" || { echo "::error::dm/$TID/shader_map.tsv missing"; exit 1; }
            grep -q "Payload/DmIOS.app/msl/$TID/b-" "$RUNNER_TEMP/listing.txt" || { echo "::error::msl/$TID missing"; exit 1; }
            ID=$(unzip -p "$IPA" "Payload/DmIOS.app/dm/$TID/romfs.id")
            echo "$TID romfs.id: $ID"
            case "$TID" in
              010013C00E930000) echo "$ID" | grep -q "size=6756439344" && echo "$ID" | grep -q "index=d709ca6f52dc7f3a" || { echo "::error::Silksong romfs.id differs from the delivered datapack"; exit 1; } ;;
              0100A00019DE0000) echo "$ID" | grep -q "size=4963474544" && echo "$ID" | grep -q "index=e0a37efd053d636a" || { echo "::error::Hades II romfs.id differs from the delivered datapack"; exit 1; } ;;
            esac
          done
          if grep -q "Payload/DmIOS.app/romfs.img" "$RUNNER_TEMP/listing.txt"; then echo "::error::a romfs.img is embedded in the shell IPA"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/verify" && cd "$RUNNER_TEMP/verify"
          unzip -q -o "$IPA" "Payload/DmIOS.app/DmIOS" "Payload/DmIOS.app/Info.plist"
          codesign -d --entitlements - Payload/DmIOS.app/DmIOS 2>&1 | grep -q "increased-memory-limit" || { echo "::error::Increased Memory Limit entitlement missing"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" Payload/DmIOS.app/Info.plist | grep -qx "org.nxnative.shellproto" || { echo "::error::bundle ID is not org.nxnative.shellproto"; exit 1; }
          echo "shell IPA verified: both games' payloads, both romfs.id at the delivered identities, entitlement in, no embedded romfs"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shell-proto
          path: |
            out/shell.ipa
            out/logs/
          retention-days: 14

      - name: Publish the shell IPA to a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="shellproto-${{ github.run_number }}"
          gh release create "$TAG" "$GITHUB_WORKSPACE/out/shell.ipa" \
            --title "Shell proto $TAG (Silksong + Hades II, one app)" \
            --notes "Prototype: one IPA, pick a game at launch. Each game's romfs.img goes in Files > DmIOS > games > <title ID> (Silksong 010013C00E930000, Hades II 0100A00019DE0000); the images are the ones from the single-game datapacks (identities unchanged). Switching games = quit and reopen the app. Saves of the single-game apps are not migrated."
          gh release view "$TAG" --json url -q .url
