name: hf-probe

# Temporary Stage-B probe for the isaac-abplus line: checks that the repo's
# HF_TOKEN can write to the private dataset Tiaoge-tou/game-archives (the
# build workflow only ever reads with it). Removed once the transfer is done.
on:
  push:
    branches: [isaac-abplus]
    paths: ['.github/workflows/hf-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe HF_TOKEN write access on the dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -eu
          pip install -q huggingface_hub
          python3 - <<'EOF'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ['HF_TOKEN'])
          me = api.whoami()
          print('whoami:', me.get('name'), me.get('type'))
          api.upload_file(path_or_fileobj=b'probe\n', path_in_repo='.hf-probe',
                          repo_id='Tiaoge-tou/game-archives', repo_type='dataset',
                          commit_message='probe: token write check')
          print('upload OK')
          api.delete_file(path_in_repo='.hf-probe', repo_id='Tiaoge-tou/game-archives',
                          repo_type='dataset', commit_message='probe: cleanup')
          print('delete OK')
          print('dataset files:', api.list_repo_files('Tiaoge-tou/game-archives', repo_type='dataset'))
          EOF
